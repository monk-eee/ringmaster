name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ringmaster
          POSTGRES_PASSWORD: ringmaster-ci
          POSTGRES_DB: ringmaster_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ringmaster"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://ringmaster:ringmaster-ci@localhost:5432/ringmaster_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "backend -> target"
      # backend/migrations/*.sql are plain forward-only DDL (no sqlx-cli
      # needed); applying them in name order matches sqlx::migrate!'s effect.
      - name: Apply migrations
        run: |
          for migration in backend/migrations/*.sql; do
            echo "applying $migration"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: cargo test
        # obligation::rebuild_projection truncates and rebuilds the whole
        # projection table (no per-test scoping); running tests in parallel
        # lets one test's rebuild race another's, producing intermittent
        # RowNotFound failures. Serial execution is the reliability fix,
        # not a new decision -- ADR-0017 already decided "run cargo test."
        run: cargo test --manifest-path backend/Cargo.toml -- --test-threads=1
      # ADR-0090: catches a known-vulnerable dependency before merge, using
      # the maintained Action's pre-built binary (a from-source `cargo
      # install cargo-audit` was tried locally and abandoned -- its
      # reqwest/rustls/gix dependency chain is too slow to compile ad hoc).
      # working-directory is deliberately the repo root (the default),
      # not backend/ -- Cargo.lock lives at the workspace root (Cargo.toml
      # here has members = ["backend"]); backend/Cargo.lock does not
      # exist, so pointing at it would fail with a missing-file error on
      # every run, not a real advisory.
      - name: cargo audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # ADR-0090: catches a known-vulnerable dependency before merge --
      # this exact check, run manually, is how ADR-0089's Vite/nanoid
      # advisories were found; CI enforcement stops a future dependency
      # bump from silently reintroducing one. --omit=dev scopes the audit
      # to the production dependency surface, matching ADR-0089's own
      # high-severity-only posture via --audit-level=high.
      - name: npm audit
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Evidence gate (ADR-0001, ADR-0002)
        run: node scripts/check-evidence.mjs
      - name: Whitespace/conflict-marker check
        run: git diff --check
