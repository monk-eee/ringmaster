name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ringmaster
          POSTGRES_PASSWORD: ringmaster-ci
          POSTGRES_DB: ringmaster
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ringmaster"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://ringmaster:ringmaster-ci@localhost:5432/ringmaster
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "backend -> target"
      # backend/migrations/*.sql are plain forward-only DDL (no sqlx-cli
      # needed); applying them in name order matches sqlx::migrate!'s effect.
      - name: Apply migrations
        run: |
          for migration in backend/migrations/*.sql; do
            echo "applying $migration"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: cargo test
        run: cargo test --manifest-path backend/Cargo.toml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Evidence gate (ADR-0001, ADR-0002)
        run: node scripts/check-evidence.mjs
      - name: Whitespace/conflict-marker check
        run: git diff --check
